<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MenuCasa - Cene e spesa della settimana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { serif: ['Fraunces', 'Georgia', 'serif'], sans: ['Nunito', 'system-ui', 'sans-serif'] },
          colors: {
            paper: '#F6F0E6', card: '#FFFDF9', cream: '#FAF5EC', sand: '#EFE4D3', sand2: '#E6D7C1', line: '#E7DAC6',
            ink: '#3B2F26', muted: '#8C7B6B',
            accent: '#D4643B', accentdk: '#B04E28', accentlt: '#FBE6DC',
            sage: '#6F8F60', sagedk: '#55744A', sagelt: '#E5EEDD', butter: '#F3C755'
          },
          boxShadow: { soft: '0 1px 2px rgba(59,47,38,.06), 0 4px 14px rgba(59,47,38,.06)' }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F6F0E6">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; background: #F6F0E6; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .sheet { animation: up .18s ease-out; }
    @keyframes up { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    .chk:checked + span { text-decoration: line-through; opacity: .45; }
    .paper-dots { background-image: radial-gradient(rgba(140,123,107,.12) 1px, transparent 1px); background-size: 14px 14px; }
  </style>
</head>
<body class="text-ink min-h-screen font-sans paper-dots">

  <header class="sticky top-0 z-40 bg-paper/90 backdrop-blur border-b border-line">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-accent text-white grid place-items-center shadow-soft">
        <i class="fa-solid fa-kitchen-set"></i>
      </div>
      <div class="flex-1 min-w-0">
        <h1 class="font-serif text-xl font-bold leading-none">Menu<span class="text-accent">Casa</span></h1>
        <p class="text-[11px] text-muted truncate mt-0.5"><span id="syncBadge"></span></p>
      </div>
      <div id="weekNav" class="flex items-center bg-card border border-line rounded-full shadow-soft">
        <button data-action="week-prev" class="w-9 h-9 rounded-full hover:bg-sand" aria-label="Settimana precedente"><i class="fa-solid fa-chevron-left text-xs"></i></button>
        <button data-action="week-today" class="h-9 px-1 text-xs font-bold" id="weekLabel">—</button>
        <button data-action="week-next" class="w-9 h-9 rounded-full hover:bg-sand" aria-label="Settimana successiva"><i class="fa-solid fa-chevron-right text-xs"></i></button>
      </div>
    </div>
  </header>

  <main id="view" class="max-w-xl mx-auto px-4 pt-4 pb-28 space-y-3"></main>

  <nav class="fixed bottom-0 inset-x-0 z-40 bg-card/95 backdrop-blur border-t border-line safe-bottom">
    <div class="max-w-xl mx-auto grid grid-cols-4 text-[11px] font-bold">
      <button data-tab="week" class="tabbtn"><i class="fa-solid fa-calendar-days"></i>Settimana</button>
      <button data-tab="shop" class="tabbtn"><i class="fa-solid fa-basket-shopping"></i>Spesa</button>
      <button data-tab="recipes" class="tabbtn"><i class="fa-solid fa-book-bookmark"></i>Ricette</button>
      <button data-tab="settings" class="tabbtn"><i class="fa-solid fa-sliders"></i>Impostazioni</button>
    </div>
  </nav>

  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-ink/40" data-action="close-modal"></div>
    <div class="absolute inset-x-0 bottom-0 max-h-[88vh] overflow-y-auto sheet">
      <div id="modalBody" class="max-w-xl mx-auto bg-card border border-line rounded-t-3xl p-4 pb-8 shadow-soft"></div>
    </div>
  </div>

  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 hidden bg-ink text-paper text-sm font-semibold px-4 py-2 rounded-full shadow-lg"></div>

  <script src="recipes.js"></script>
  <script src="catalog.js"></script>
  <script src="firebase-config.js"></script>
  <script>
  'use strict';
  // =====================================================================
  //  Costanti e utilità
  // =====================================================================
  const STORE_KEY = 'menucasa-v2';
  const GIORNI = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
  const GG = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
  const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
  const KIDS = {
    grande:  { n: 'Il grande',  e: '🎒', where: 'scuola' },
    piccolo: { n: 'Il piccolo', e: '🧸', where: 'nido' }
  };
  const P_INFO = {
    pesce:     { e: '🐟', l: 'Pesce',     cls: 'bg-sky-100 text-sky-800' },
    carne:     { e: '🍗', l: 'Carne',     cls: 'bg-rose-100 text-rose-800' },
    salumi:    { e: '🥓', l: 'Salumi',    cls: 'bg-pink-100 text-pink-800' },
    uova:      { e: '🥚', l: 'Uova',      cls: 'bg-yellow-100 text-yellow-800' },
    legumi:    { e: '🫘', l: 'Legumi',    cls: 'bg-amber-100 text-amber-800' },
    formaggio: { e: '🧀', l: 'Formaggio', cls: 'bg-orange-100 text-orange-800' },
    verdure:   { e: '🥦', l: 'Verdure',   cls: 'bg-lime-100 text-lime-800' }
  };
  const C_INFO = { pasta: 'Pasta', riso: 'Riso', zuppa: 'Zuppa', pane: 'Pane', patate: 'Patate', polenta: 'Polenta', pizza: 'Pizza' };
  const FISH_OK = ['tonno', 'platessa', 'merluzzo', 'polipo', 'totano', 'seppie'];
  const TARGET = { pesce: [2, 3], legumi: [2, 3], uova: [0, 2], formaggio: [0, 2], carne: [0, 3], salumi: [0, 1], verdure: [0, 2] };
  // obiettivi settimanali per proteina [min, max]: quelli scelti in Impostazioni, altrimenti i predefiniti
  const tgt = p => { const t = S.target?.[p]; return Array.isArray(t) ? t : (TARGET[p] || [0, 9]); };
  const BASE_WORDS = /^(olio|sale|pepe|aceto|origano|rosmarino|salvia|alloro|aglio|farina 00|pangrattato|zucchero|dado|brodo)/i;
  const PZ_G = { carote: 100, zucchine: 200, patate: 200, cipolla: 150, pomodori: 150, finocchi: 300 };

  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
  const fmtD = d => `${d.getDate()} ${MESI[d.getMonth()]}`;
  const dowOf = d => (d.getDay() + 6) % 7;
  const todayIso = () => iso(new Date());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2400);
  }

  // =====================================================================
  //  Stato
  //  - "condiviso": piano, spesa, ricette, impostazioni di famiglia (sincronizzati)
  //  - "locale": scheda aperta, filtri, codice famiglia (solo su questo telefono)
  // =====================================================================
  const SHARED_SETTINGS = ['people', 'piccolo', 'pastedGrande', 'customRecipes', 'flags', 'reparti', 'target'];
  const DEFAULT_STATE = () => ({
    people: 4,
    piccolo: { season: 'auto', anchorMonday: null, anchorWeek: null },
    pastedGrande: {},       // settimane del grande incollate a mano: { lunedìISO: {label, days:[[...]]} }
    customRecipes: [],
    flags: {},              // { idRicetta: 'fav' | 'ban' }
    reparti: MC_REPARTI.map(r => r[0]),
    target: {},             // { proteina: [min, max] } se diverso dal predefinito
    plan: {},               // { dataISO: { cena:{id|custom,locked}, pranzo:{...}, home:{grande,piccolo} } }
    shop: {},               // { lunedìISO: { checked:{key:true} } }  spunte degli ingredienti delle ricette
    list: {},               // lista sempre aperta: { id: { t, r, ts, note?, c? } }   (c = già nel carrello)
    hist: {},               // prodotti comprati: { chiave: { t, r, n, last } } -> "I soliti" e "recenti"
    // locali
    tab: 'week', showChecked: true, shopPast: false, family: null
  });
  let S;
  function load() {
    try { S = Object.assign(DEFAULT_STATE(), JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); }
    catch { S = DEFAULT_STATE(); }
    fixReparti();
    // vecchie voci aggiunte a mano (legate alla settimana) -> lista sempre aperta
    Object.values(S.shop).forEach(w => {
      Object.entries(w.extras || {}).forEach(([id, x]) => { S.list[id] = { t: x.t, r: x.r, ts: x.ts || Date.now() }; });
      delete w.extras;
    });
    seedSoliti();
  }
  // "I soliti" di partenza (dai prodotti più usati in Bring!), aggiunti solo se mancano
  function seedSoliti() {
    (window.MC_SOLITI || []).forEach((t, i) => {
      const k = histKey(t); if (S.hist[k]) return;
      const c = catFind(t); S.hist[k] = { t, r: c?.r || guessReparto(t), n: 3, last: 0, o: i };
    });
  }

  // =====================================================================
  //  Catalogo prodotti
  // =====================================================================
  const CAT = Object.entries(window.MC_CATALOG || {}).flatMap(([r, arr]) => arr.map(s => { const [t, e] = s.split('|'); return { t, e, r }; }));
  const CAT_BY = new Map(CAT.map(c => [c.t.toLowerCase(), c]));
  const catFind = t => CAT_BY.get(String(t).toLowerCase().trim()) || null;
  const histKey = t => String(t).toLowerCase().trim().replace(/[^a-z0-9àèéìòù]+/g, '_');
  // Icona di un prodotto: confronta le parole "radice" (senza singolare/plurale) con il catalogo.
  // 1) nome identico  2) il prodotto del catalogo più lungo con cui il nome comincia ("Pasta corta" -> Pasta)
  // 3) una parola del nome che è un prodotto del catalogo ("Cosce di pollo" -> Pollo) o ne è la prima parola ("Tonno" -> Tonno in scatola)  4) icona del reparto
  const STOP = new Set(['di', 'del', 'della', 'dei', 'delle', 'a', 'al', 'alla', 'ai', 'e', 'in', 'con', 'per', 'da', 'su']);
  const EMOJI_ALIAS = { polp: 'polip', calamar: 'totan' };
  const stemsOf = t => String(t).toLowerCase().replace(/sott['’ ]?olio/g, '').replace(/[^a-zàèéìòù]+/g, ' ').trim().split(' ')
    .filter(w => w && !STOP.has(w)).map(w => { const x = w.length > 3 ? w.replace(/[aeiouàèéìòù]$/, '') : w; return EMOJI_ALIAS[x] || x; });
  const CAT_STEMS = CAT.map(c => ({ c, st: stemsOf(c.t) })).filter(x => x.st.length);
  const emojiCache = new Map();
  function emojiOf(t, r) {
    const c = catFind(t); if (c) return c.e;
    const key = `${String(t).toLowerCase()}|${r}`; if (emojiCache.has(key)) return emojiCache.get(key);
    const st = stemsOf(t); let best = null;
    CAT_STEMS.forEach(x => { if (x.st.length <= st.length && x.st.every((w, i) => w === st[i]) && (!best || x.st.length > best.st.length)) best = x; });
    if (!best) best = CAT_STEMS.find(x => x.st.length === 1 && st.includes(x.st[0])) || CAT_STEMS.find(x => st.includes(x.st[0]));
    const e = best ? best.c.e : (MC_REPARTI.find(x => x[0] === r)?.[2] || '🛒');
    emojiCache.set(key, e); return e;
  }
  // reparti: se l'ordine è ancora quello vecchio di default passa a quello delle corsie; i reparti nuovi si inseriscono al loro posto
  function fixReparti() {
    const def = MC_REPARTI.map(r => r[0]);
    if (!Array.isArray(S.reparti) || S.reparti.join() === (window.MC_REPARTI_OLD || []).join()) { S.reparti = def; return; }
    S.reparti = S.reparti.filter(k => def.includes(k));
    def.forEach((k, i) => { if (!S.reparti.includes(k)) { const prev = def.slice(0, i).reverse().find(x => S.reparti.includes(x)); S.reparti.splice(prev ? S.reparti.indexOf(prev) + 1 : 0, 0, k); } });
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch { toast('Impossibile salvare: memoria piena?'); } }

  // =====================================================================
  //  Sincronizzazione tra telefoni (Firebase Firestore)
  //  families/{codice}                 -> { settings: JSON, updated }
  //  families/{codice}/days/{data}     -> { cena, pranzo, home }
  //  families/{codice}/shop/{lunedì}   -> { checked:{}, extras:{} }
  // =====================================================================
  const FB_VER = '10.12.2';
  const Sync = {
    on: false, state: 'off', fs: null, db: null, root: null, unsub: [],
    get available() { return !!window.MC_FIREBASE; },

    async start() {
      if (!this.available || !S.family || this.on) return;
      this.set('connecting');
      try {
        const base = `https://www.gstatic.com/firebasejs/${FB_VER}`;
        const [{ initializeApp, getApps }, auth, fs] = await Promise.all([
          import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`)]);
        const app = getApps()[0] || initializeApp(window.MC_FIREBASE);
        await auth.signInAnonymously(auth.getAuth(app));
        let db;
        try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache() }); } catch { db = fs.getFirestore(app); }
        Object.assign(this, { fs, db, root: fs.doc(db, 'families', S.family), on: true });
        await this.bootstrap();
        this.listen();
      } catch (e) {
        console.error(e); this.on = false; this.set('error');
      }
    },

    // Prima connessione: se la famiglia esiste prendo i suoi dati, altrimenti carico i miei
    async bootstrap() {
      const { fs } = this;
      const snap = await fs.getDoc(this.root);
      if (snap.exists()) return;
      const batch = fs.writeBatch(this.db);
      batch.set(this.root, this.settingsPayload());
      Object.entries(S.plan).forEach(([d, v]) => batch.set(fs.doc(this.root, 'days', d), v));
      Object.entries(S.shop).forEach(([w, v]) => batch.set(fs.doc(this.root, 'shop', w), v));
      batch.set(fs.doc(this.root, 'misc', 'list'), { items: S.list, hist: S.hist });
      await batch.commit();
    },

    listen() {
      const { fs } = this; const opt = { includeMetadataChanges: true };
      this.meta = {};
      this.unsub.push(fs.onSnapshot(this.root, opt, s => {
        if (s.exists() && !s.metadata.hasPendingWrites) {
          try { const data = JSON.parse(s.data().settings || '{}'); SHARED_SETTINGS.forEach(k => { if (k in data) S[k] = data[k]; }); } catch {}
          fixReparti();
        }
        this.changed('settings', s);
      }, e => this.fail(e)));
      this.unsub.push(fs.onSnapshot(fs.collection(this.root, 'days'), opt, q => {
        const plan = {}; q.forEach(doc => { plan[doc.id] = doc.data(); }); S.plan = plan; this.changed('days', q);
      }, e => this.fail(e)));
      this.unsub.push(fs.onSnapshot(fs.collection(this.root, 'shop'), opt, q => {
        const shop = {}; q.forEach(doc => { const v = doc.data(); shop[doc.id] = { checked: v.checked || {} }; }); S.shop = shop; this.changed('shop', q);
      }, e => this.fail(e)));
      this.unsub.push(fs.onSnapshot(fs.doc(this.root, 'misc', 'list'), opt, s => {
        const v = s.exists() ? s.data() : {};
        S.list = v.items || {}; if (v.hist) { S.hist = v.hist; seedSoliti(); } this.changed('list', s);
      }, e => this.fail(e)));
    },

    // stato complessivo: il peggiore tra i tre ascoltatori
    changed(key, snap) {
      this.meta[key] = snap.metadata;
      const m = Object.values(this.meta);
      save();
      this.set(m.some(x => x.hasPendingWrites) ? 'pending' : (m.length < 4 || m.some(x => x.fromCache)) ? 'offline' : 'ok');
      scheduleRender();
      if (key === 'list') refreshCatalog(false);
    },
    fail(e) { console.error(e); this.set('error'); },
    stop() { this.unsub.forEach(u => u()); this.unsub = []; this.on = false; this.set('off'); },
    set(st) { this.state = st; renderSyncBadge(); },

    settingsPayload() {
      const o = {}; SHARED_SETTINGS.forEach(k => { o[k] = S[k]; });
      return { settings: JSON.stringify(o), updated: Date.now() };
    },
    // ---- scritture (no-op se la sincronizzazione è spenta) ----
    days(dates) {
      if (!this.on) return;
      const { fs } = this; const batch = fs.writeBatch(this.db);
      dates.forEach(d => {
        const ref = fs.doc(this.root, 'days', d); const v = S.plan[d];
        if (v && Object.keys(v).length) batch.set(ref, JSON.parse(JSON.stringify(v))); else batch.delete(ref);
      });
      batch.commit().catch(e => this.fail(e));
    },
    settings() { if (this.on) this.fs.setDoc(this.root, this.settingsPayload()).catch(e => this.fail(e)); },
    shopPatch(week, patch) {
      if (!this.on) return;
      this.fs.setDoc(this.fs.doc(this.root, 'shop', week), patch, { merge: true }).catch(e => this.fail(e));
    },
    shopCheck(week, key, val) { if (this.on) this.shopPatch(week, { checked: { [key]: val ? true : this.fs.deleteField() } }); },
    shopReplaceChecked(week) {
      if (!this.on) return;
      this.fs.setDoc(this.fs.doc(this.root, 'shop', week), { checked: {} }, { mergeFields: ['checked'] }).catch(e => this.fail(e));
    },
    // lista sempre aperta: patch(del) riceve deleteField per cancellare un campo
    list(fn) {
      if (!this.on) return;
      const patch = fn(() => this.fs.deleteField());
      this.fs.setDoc(this.fs.doc(this.root, 'misc', 'list'), patch, { merge: true }).catch(e => this.fail(e));
    }
  };

  function renderSyncBadge() {
    const b = $('#syncBadge'); if (!b) return;
    const map = {
      off: S.family ? ['fa-cloud', 'text-muted', 'sincronizzazione spenta'] : ['fa-mobile-screen', 'text-muted', 'solo su questo telefono'],
      connecting: ['fa-cloud-arrow-up', 'text-muted', 'mi collego…'],
      ok: ['fa-cloud', 'text-sage', 'sincronizzato con la famiglia'],
      pending: ['fa-cloud-arrow-up', 'text-butter', 'invio modifiche…'],
      offline: ['fa-cloud', 'text-muted', 'offline: invio appena c\'è rete'],
      error: ['fa-triangle-exclamation', 'text-accent', 'errore di sincronizzazione']
    };
    const [i, c, t] = map[Sync.state] || map.off;
    b.innerHTML = `<i class="fa-solid ${i} ${c} mr-1"></i>${t}`;
  }

  const FAMILY_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newFamilyCode() {
    const a = new Uint32Array(12); crypto.getRandomValues(a);
    const s = [...a].map(n => FAMILY_ALPHABET[n % FAMILY_ALPHABET.length]).join('');
    return `${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8, 12)}`;
  }
  const normCode = c => (c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/(.{4})(?=.)/g, '$1-');
  function familyLink() { return `${location.origin}${location.pathname}#famiglia=${S.family}`; }

  // =====================================================================
  //  Menù scolastici
  // =====================================================================
  let PICCOLO = null, GRANDE = { weeks: {} };
  let weekStart = mondayOf(new Date());

  async function loadMenus() {
    const get = async (u) => { try { const r = await fetch(u, { cache: 'no-cache' }); return r.ok ? r.json() : null; } catch { return null; } };
    const [p, g] = await Promise.all([get('data/piccolo.json'), get('data/grande.json')]);
    PICCOLO = p; if (g) GRANDE = g;
  }

  function piccoloSeason(date) {
    if (S.piccolo.season !== 'auto') return S.piccolo.season;
    const m = date.getMonth() + 1;
    return (m >= 10 || m <= 4) ? 'ai' : 'pe';
  }
  function piccoloWeek(monday) {
    if (!PICCOLO) return null;
    const am = S.piccolo.anchorMonday || PICCOLO.anchor.monday;
    const aw = S.piccolo.anchorWeek || PICCOLO.anchor.week;
    const diff = Math.round((monday - parseIso(am)) / (7 * 864e5));
    return (((aw - 1 + diff) % 4) + 4) % 4 + 1;
  }
  function piccoloDay(date) {
    const dow = dowOf(date);
    if (!PICCOLO || dow > 4) return null;
    const w = piccoloWeek(mondayOf(date)); const season = PICCOLO.seasons[piccoloSeason(date)];
    return { week: w, season: season.name, dishes: season.pranzo[w - 1][dow], merenda: season.merenda?.[w - 1]?.[dow] };
  }
  function grandeWeekData(monday) {
    const k = iso(monday);
    return S.pastedGrande[k] || GRANDE.weeks?.[k] || null;
  }
  function grandeDay(date) {
    const dow = dowOf(date);
    if (dow > 4) return null;
    const w = grandeWeekData(mondayOf(date));
    const dishes = w?.days?.[dow] || [];
    return dishes.length ? { label: w.label, dishes } : { missing: true };
  }

  // Parser del testo copiato dal sito della scuola (stessa logica di scripts/scrape_grande.py)
  function parseGrandeText(text) {
    const lines = text.replace(/ /g, ' ').split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim());
    const dayRe = /^(LUNED|MARTED|MERCOLED|GIOVED|VENERD)[IÌ]\s*['’`]?\s*$/i;
    const rangeRe = /dal\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s+al\s+(\d{1,2})\/(\d{1,2})/i;
    const idx = { LUNED: 0, MARTED: 1, MERCOLED: 2, GIOVED: 3, VENERD: 4 };
    const now = new Date(); const weeks = {};
    let cur = null, day = null, label = '';
    for (const ln of lines) {
      if (!ln) { if (cur && day !== null && cur.days[day].length) day = null; continue; }
      if (/SETTIMANA/i.test(ln) && ln.length < 40) { label = ln; continue; }
      const m = ln.match(rangeRe);
      if (m) {
        const d0 = +m[1], m0 = +m[2];
        const first = m[3] ? new Date(+m[3] + (m[3].length === 2 ? 2000 : 0), m0 - 1, d0)
          : [now.getFullYear() - 1, now.getFullYear(), now.getFullYear() + 1]
            .map(y => new Date(y, m0 - 1, d0)).sort((a, b) => Math.abs(a - now) - Math.abs(b - now))[0];
        cur = { label: label.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()), range: m[0], days: [[], [], [], [], []] };
        weeks[iso(mondayOf(first))] = cur; day = null; continue;
      }
      if (/^MENU/i.test(ln)) { day = null; continue; }
      const dm = ln.match(dayRe);
      if (dm && cur) { day = idx[dm[1].toUpperCase()]; continue; }
      if (cur && day !== null && cur.days[day].length < 5 && ln.length < 80) cur.days[day].push(ln);
    }
    for (const k of Object.keys(weeks)) if (!weeks[k].days.some(d => d.length)) delete weeks[k];
    return weeks;
  }

  // =====================================================================
  //  Classificazione dei piatti
  // =====================================================================
  function tagsOf(text) {
    const t = text.toLowerCase();
    const tags = new Set();
    const fish = /pesce|merluzzo|platessa|halibut|tonno|salmone|polpo|polipo|totan|seppi|nasello|orata|branzino|sgombr|alici|gamber|calamar/.test(t);
    if (fish) tags.add('pesce');
    if (/pollo|tacchino|manzo|vitell|maiale|brasato|bollito|spezzatino|salsicc|cotolett|scaloppin|hamburger|arrosto|\bcarne\b|lonza|fesa/.test(t) && !/brodo di carne$/.test(t)) tags.add('carne');
    if (!fish && /ragù|ragu/.test(t)) tags.add('carne');
    if (/prosciutto|speck|bresaola|salame|mortadella|wurstel|würstel|pancetta/.test(t)) tags.add('salumi');
    if (/\buov|frittat/.test(t)) tags.add('uova');
    if (/fagiol(?!ini)|\bcec[ie]\b|lenticch|piselli|legumi|borlott|cannellin|\bfave\b/.test(t)) tags.add('legumi');
    if (/mozzarell|stracchino|asiago|robiola|crescenza|caciott|formagg|fontina|scamorza|ricotta|pizza margherita|montasio|emmental/.test(t)) tags.add('formaggio');
    const primo = /pasta|pastina|spaghett|maccheron|riso\b|risott|\borzo\b|gnocchi|lasagn|polenta|pizza|tortellin|ravioli/.test(t);
    return { tags, primo, pizza: /pizza/.test(t) };
  }
  const group = p => (p === 'salumi' ? 'carne' : p);

  function lunchInfo(dateIsoStr) {
    const date = parseIso(dateIsoStr);
    const home = S.plan[dateIsoStr]?.home || {};
    const out = { tags: new Set(), primo: false, pizza: false, kids: [] };
    const add = (who, d) => {
      if (!d || d.missing) return;
      d.dishes.forEach(x => { const r = tagsOf(x); r.tags.forEach(t => out.tags.add(group(t))); out.primo ||= r.primo; out.pizza ||= r.pizza; });
      out.kids.push(who);
    };
    if (!home.grande) add('grande', grandeDay(date));
    if (!home.piccolo) add('piccolo', piccoloDay(date));
    return out;
  }

  // =====================================================================
  //  Ricette
  // =====================================================================
  function allRecipes() {
    const map = new Map(MC_RECIPES.map(r => [r.id, r]));
    S.customRecipes.forEach(r => map.set(r.id, r));
    return [...map.values()];
  }
  const recipeById = id => allRecipes().find(r => r.id === id) || null;
  const isFishOk = r => r.p !== 'pesce' || !r.fish || FISH_OK.includes(r.fish);

  // =====================================================================
  //  Pianificazione
  // =====================================================================
  const SPECIAL = {
    avanzi: { n: 'Avanzi / svuota frigo', e: '♻️' },
    fuori: { n: 'Fuori o pizzeria', e: '🍕' }
  };
  function slotsOf(dateIsoStr) {
    const dow = dowOf(parseIso(dateIsoStr));
    const home = S.plan[dateIsoStr]?.home || {};
    const s = [];
    if (dow >= 5 || home.grande || home.piccolo) s.push('pranzo');
    s.push('cena');
    return s;
  }
  function weekDays(monday) { return [...Array(7)].map((_, i) => iso(addDays(monday, i))); }
  const entry = (d, slot) => S.plan[d]?.[slot] || null;
  function entryRecipe(e) {
    if (e && e.custom) return (e.p || e.c) ? { id: 'custom:' + e.custom.toLowerCase(), n: e.custom, p: e.p || '', c: e.c || '', ing: [] } : null;
    return e && e.id && !SPECIAL[e.id] ? recipeById(e.id) : null;
  }
  function setEntry(d, slot, val) {
    S.plan[d] = S.plan[d] || {};
    if (val) S.plan[d][slot] = val; else delete S.plan[d][slot];
  }

  function weekCounts(monday, exclude) {
    const c = {}; const used = new Set();
    weekDays(monday).forEach(d => slotsOf(d).forEach(slot => {
      if (exclude && exclude[0] === d && exclude[1] === slot) return;
      const r = entryRecipe(entry(d, slot));
      if (r) { if (r.p) c[r.p] = (c[r.p] || 0) + 1; used.add(r.id); if (r.c === 'pizza') c._pizza = (c._pizza || 0) + 1; }
    }));
    return { c, used };
  }
  function prevMeal(d, slot) {
    if (slot === 'cena' && slotsOf(d).includes('pranzo')) return entryRecipe(entry(d, 'pranzo'));
    return entryRecipe(entry(iso(addDays(parseIso(d), -1)), 'cena'));
  }
  function recentlyUsed(d, days) {
    const ids = new Set(); const base = parseIso(d);
    for (let i = 1; i <= days; i++) {
      const x = iso(addDays(base, -i));
      ['pranzo', 'cena'].forEach(s => { const e = entry(x, s); if (e?.id) ids.add(e.id); });
    }
    return ids;
  }

  function scoreRecipe(r, d, slot, ctx) {
    let s = 0; const why = []; const bad = [];
    if (S.flags[r.id] === 'ban') return { s: -1e9, why, bad: ['segnata "mai più"'] };
    if (!isFishOk(r)) { s -= 500; bad.push('pesce non gradito'); }
    const g = group(r.p);
    if (slot === 'cena') {
      if (ctx.lunch.tags.has(g)) { s -= 100; bad.push(`${P_INFO[r.p].l.toLowerCase()} già a pranzo`); }
      if (ctx.lunch.pizza && r.c === 'pizza') { s -= 120; bad.push('pizza già a pranzo'); }
      if (ctx.lunch.primo && (r.c === 'pasta' || r.c === 'riso')) { s -= 60; bad.push('primo già a pranzo'); }
      if (ctx.lunch.kids.length && !ctx.lunch.tags.has(g) && g !== 'verdure') why.push('diverso dal pranzo');
      if (r.s === 'p') s -= 35;
    } else {
      if (r.s === 'p') { s += 15; why.push('piatto da pranzo'); } else s -= 5;
    }
    if (ctx.prev?.p && group(ctx.prev.p) === g) { s -= 30; bad.push('stessa proteina del pasto prima'); }
    if (ctx.used.has(r.id)) { s -= 200; bad.push('già in settimana'); }
    else if (ctx.recent.has(r.id)) { s -= 70; bad.push('fatto da poco'); }
    const n = ctx.counts[r.p] || 0; const [min, max] = tgt(r.p);
    if (n < min) { s += 35 - n * 8; why.push(`${P_INFO[r.p].l.toLowerCase()} in settimana: ${n} su ${min}`); }
    if (n >= max) { s -= 45; bad.push(`${P_INFO[r.p].l.toLowerCase()} già ${n} volte`); }
    if (r.c === 'pizza') { if (ctx.counts._pizza) { s -= 80; bad.push('pizza già in settimana'); } else if (ctx.dow === 5 && slot === 'cena') { s += 30; why.push('sabato pizza'); } }
    if (S.flags[r.id] === 'fav') { s += 15; why.push('preferita'); }
    return { s, why, bad };
  }

  function contextFor(d, slot) {
    const lunch = slot === 'cena' && slotsOf(d).includes('pranzo')
      ? (() => { const r = entryRecipe(entry(d, 'pranzo')); const o = { tags: new Set(), primo: false, pizza: false, kids: [] };
                 if (r) { if (r.p) o.tags.add(group(r.p)); o.primo = ['pasta', 'riso', 'pizza'].includes(r.c); o.pizza = r.c === 'pizza'; o.kids = ['casa']; } return o; })()
      : lunchInfo(d);
    const { c, used } = weekCounts(mondayOf(parseIso(d)), [d, slot]);
    return { lunch, counts: c, used, prev: prevMeal(d, slot), recent: recentlyUsed(d, 10), dow: dowOf(parseIso(d)) };
  }
  function ranked(d, slot) {
    const ctx = contextFor(d, slot);
    return allRecipes().map(r => ({ r, ...scoreRecipe(r, d, slot, ctx) })).sort((a, b) => b.s - a.s);
  }
  function pickFor(d, slot) {
    const list = ranked(d, slot).filter(x => x.s > -150);
    if (!list.length) return null;
    const top = list.slice(0, 4); const best = top[0].s;
    const pool = top.filter(x => x.s >= best - 25);
    return pool[Math.floor(Math.random() * pool.length)].r;
  }
  function generateWeek(monday, all) {
    let n = 0; const touched = [];
    weekDays(monday).forEach(d => slotsOf(d).forEach(slot => {
      const e = entry(d, slot);
      if (e && (e.locked || !all)) return;
      setEntry(d, slot, null);
      const r = pickFor(d, slot);
      if (r) { setEntry(d, slot, { id: r.id, locked: false }); n++; }
      touched.push(d);
    }));
    save(); Sync.days([...new Set(touched)]); return n;
  }

  // =====================================================================
  //  Lista della spesa
  // =====================================================================
  function guessReparto(name) {
    const t = name.toLowerCase();
    if (BASE_WORDS.test(t)) return 'base';
    for (const k of S.reparti) { const h = MC_REPARTO_HINTS[k]; if (h && new RegExp(h).test(t)) return k; }
    return 'altro';
  }
  function fmtQty(q, u) {
    if (!q) return '';
    if (u === 'g' && q >= 1000) return `${(q / 1000).toLocaleString('it-IT', { maximumFractionDigits: 1 })} kg`;
    if (u === 'ml' && q >= 1000) return `${(q / 1000).toLocaleString('it-IT', { maximumFractionDigits: 1 })} l`;
    if (u === 'g' || u === 'ml') return `${Math.round(q / 10) * 10} ${u}`;
    return `${Math.ceil(q)} ${u === 'pz' ? '' : u}`.trim();
  }
  const shopDays = monday => { const t = todayIso(); return weekDays(monday).filter(d => S.shopPast || d >= t); };
  function shopItems(monday) {
    const k = S.people / 4; const items = new Map();
    shopDays(monday).forEach(d => slotsOf(d).forEach(slot => {
      const r = entryRecipe(entry(d, slot)); if (!r) return;
      r.ing.forEach(([name, q, u, rep]) => {
        const w = PZ_G[name.toLowerCase()];
        if (u === 'pz' && w) { q = q * w; u = 'g'; }
        const key = `${name.toLowerCase()}|${u || ''}`;
        const it = items.get(key) || { key, name, u: u || '', q: 0, rep: rep || guessReparto(name), uses: [] };
        it.q += (q || 0) * k; it.uses.push(`${GG[dowOf(parseIso(d))]} ${slot}`);
        items.set(key, it);
      });
    }));
    return [...items.values()];
  }
  function shopState(monday) {
    const k = iso(monday);
    S.shop[k] = S.shop[k] || { checked: {} };
    S.shop[k].checked ||= {};

  }
  // tutto quello che va comprato: ingredienti delle cene della settimana + lista sempre aperta
  function shopAll(monday) {

      .map(([id, x]) => ({ key: `l:${id}`, name: x.t, rep: catFind(x.t)?.r || x.r || 'altro', q: 0, u: '', listId: id, note: x.note }));
    return [...shopItems(monday).filter(i => i.rep !== 'base'), ...listed];
  }
  const isChecked = (i, st) => i.listId ? !!S.list[i.listId]?.c : !!st.checked[i.key];

  // ---- lista sempre aperta ----
  const inList = t => Object.entries(S.list).find(([, x]) => x.t.toLowerCase() === String(t).toLowerCase().trim());
  function addToList(t, r, note) {
    t = String(t).trim().replace(/\s+/g, ' '); if (!t) return null;
    t = t.charAt(0).toUpperCase() + t.slice(1);
    const ex = inList(t); if (ex) return ex[0];
    const c = catFind(t); const h = S.hist[histKey(t)];
    let rep = r || c?.r || h?.r || guessReparto(t); if (rep === 'base') rep = 'condimenti';
    const id = uid(); const x = { t: c?.t || t, r: rep, ts: Date.now() }; if (note) x.note = note;
    S.list[id] = x; save(); Sync.list(() => ({ items: { [id]: x } }));
    return id;
  }
  function removeFromList(id) {

  }
  function bump(t, r) {
    const k = histKey(t); const h = S.hist[k] || { t, r, n: 0 };

  function finishShopping() {

    save();

  }

  // ---------- Spesa ----------

  // ---------- Catalogo (finestra "Aggiungi prodotti") ----------
  let catQuery = ''; let catIsOpen = false; const catOpen = new Set();
  function catTile(t, e, r, sub) {
    const on = !!inList(t);
    return `<button type="button" data-action="cat-toggle" data-t="${esc(t)}" data-r="${esc(r)}" class="rounded-2xl px-1 pt-2 pb-1.5 text-center border transition ${on ? 'bg-accent border-accent text-white shadow-soft' : 'bg-cream border-line hover:bg-sand'}">

    </button>`;
  }
  const grid = inner => `<div class="grid grid-cols-4 gap-1.5">${inner}</div>`;
  const repOf = k => MC_REPARTI.find(x => x[0] === k) || [k, k, '🛒'];
  function knownProducts() {
    const m = new Map(CAT.map(c => [c.t.toLowerCase(), c]));
    Object.values(S.hist).forEach(h => { if (!m.has(h.t.toLowerCase())) m.set(h.t.toLowerCase(), { t: h.t, e: emojiOf(h.t, h.r), r: h.r === 'dispensa' ? guessReparto(h.t).replace('base', 'condimenti') : h.r }); });
    return [...m.values()];
  }
  function catalogBody() {
    const q = catQuery.trim().toLowerCase();
    const n = Object.keys(S.list).length;
    let h = `<div class="sticky -top-1 z-10 bg-card -mx-4 px-4 pt-1 pb-3 border-b border-line mb-3">

        <button class="w-10 h-10 rounded-full bg-sage text-white shrink-0" title="Aggiungi"><i class="fa-solid fa-plus"></i></button>
      </form></div>`;
    if (q) {
      const res = knownProducts().filter(c => c.t.toLowerCase().includes(q))
        .sort((a, b) => a.t.toLowerCase().indexOf(q) - b.t.toLowerCase().indexOf(q) || a.t.localeCompare(b.t)).slice(0, 40);
      if (!res.some(c => c.t.toLowerCase() === q)) {
        const t = catQuery.trim(); let r0 = guessReparto(t); if (r0 === 'base') r0 = 'condimenti';
        h += `<div class="text-xs font-bold uppercase tracking-wide text-muted mb-1.5">Nuovo prodotto</div>`
          + grid(catTile(t.charAt(0).toUpperCase() + t.slice(1), '➕', r0, repOf(r0)[1])) + '<div class="h-3"></div>';
      }
      if (res.length) h += grid(res.map(c => catTile(c.t, c.e, c.r)).join(''));
      return h;
    }
    const hist = Object.values(S.hist);
    const soliti = [...hist].sort((a, b) => (b.n || 0) - (a.n || 0) || (a.o ?? 99) - (b.o ?? 99)).slice(0, 12);
    if (soliti.length) h += `<div class="text-xs font-bold uppercase tracking-wide text-sagedk mb-1.5">⭐ I soliti</div>` + grid(soliti.map(x => catTile(x.t, emojiOf(x.t, x.r), catFind(x.t)?.r || x.r)).join('')) + '<div class="h-4"></div>';
    const recenti = hist.filter(x => x.last).sort((a, b) => b.last - a.last).slice(0, 8);
    if (recenti.length) h += `<div class="text-xs font-bold uppercase tracking-wide text-muted mb-1.5">🕘 Comprati di recente</div>` + grid(recenti.map(x => catTile(x.t, emojiOf(x.t, x.r), catFind(x.t)?.r || x.r)).join('')) + '<div class="h-4"></div>';
    const known = knownProducts();
    S.reparti.forEach(k => {
      const items = known.filter(c => c.r === k); if (!items.length) return;
      const r = repOf(k); const sel = items.filter(c => inList(c.t)).length;
      h += `<details class="mb-2 bg-cream/60 rounded-2xl px-2 py-2" ${catOpen.has(k) ? 'open' : ''} data-rep="${k}"><summary class="flex items-center gap-2 px-1 font-serif font-bold text-sm cursor-pointer">${r[2]} ${r[1]}<span class="ml-auto text-xs font-sans ${sel ? 'text-accent font-bold' : 'text-muted'}">${sel ? sel + ' in lista' : items.length}</span></summary>
        <div class="mt-2">${grid(items.sort((a, b) => a.t.localeCompare(b.t)).map(c => catTile(c.t, c.e, c.r)).join(''))}</div></details>`;
    });
    h += `<details class="mt-4"><summary class="text-xs font-bold text-muted underline cursor-pointer">Incolla una lista (da Bring!, WhatsApp, note…)</summary>
      <form data-form="paste-list" class="mt-2 space-y-2"><textarea name="t" rows="5" placeholder="Un prodotto per riga, oppure separati da virgole" class="w-full ${inputCls}"></textarea>
      <button class="w-full ${btnSoft}">Aggiungi tutti</button></form></details>`;

  }

  function openRecipeEditor(id) {
    const r = id ? recipeById(id) : { n: '', p: 'carne', c: 'pane', ing: [] };
    const ingText = r.ing.map(([n, q, u]) => (q ? `${q} ${u} ` : '') + n).join('\n');
    const opt = (o, v) => Object.entries(o).map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${typeof l === 'string' ? l : l.e + ' ' + l.l}</option>`).join('');

        <input name="n" required value="${esc(r.n)}" placeholder="Nome (es. Pollo al curry con riso)" class="w-full ${inputCls}">

        <label class="block text-xs font-bold text-muted">Ingredienti per 4 persone, uno per riga<br><span class="font-normal">es. "500 g petto di pollo", "2 pz zucchine", "1 conf piadine", "olio" (senza quantità = da dispensa)</span>
          <textarea name="ing" rows="8" class="mt-1 w-full ${inputCls} text-ink font-mono">${esc(ingText)}</textarea></label>
        <button class="w-full ${btnPrimary}">Salva</button>
      </form>`);

  function parseIngredients(text) {
    return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const m = l.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|pz|conf)?\s+(.+)$/i);
      if (!m) return [l, 0, '', guessReparto(l)];
      let q = parseFloat(m[1].replace(',', '.')); let u = (m[2] || 'pz').toLowerCase();
      if (u === 'kg') { q *= 1000; u = 'g'; } if (u === 'l') { q *= 1000; u = 'ml'; }
      const name = m[3].charAt(0).toUpperCase() + m[3].slice(1);
      return [name, q, u, guessReparto(name)];
    });
  }

  async function joinFamily(code, fromLink) {
    code = normCode(code);
    if (code.replace(/-/g, '').length !== 12) { toast('Codice non valido'); return; }
    if (!Sync.available) { toast('Sincronizzazione non ancora configurata'); return; }
    if (S.family === code) return;
    if (!fromLink || confirm(`Collego questo telefono alla famiglia ${code}?\nVedrai la settimana e la lista condivise.`)) {
      Sync.stop(); S.family = code; save(); render(); await Sync.start(); toast('Telefono collegato');
    }
  }
  async function shareText(text, fallbackMsg) {
    if (navigator.share) { try { await navigator.share({ text }); return; } catch { return; } }
    try { await navigator.clipboard.writeText(text); toast(fallbackMsg); }
    catch { window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'); }
  }

  // =====================================================================

  document.addEventListener('click', async (ev) => {
    if (ev.target.closest('[data-stop]')) return;
    const tab = ev.target.closest('[data-tab]');
    if (tab) { S.tab = tab.dataset.tab; save(); render(); window.scrollTo(0, 0); return; }
    const el = ev.target.closest('[data-action]'); if (!el) return;
    const a = el.dataset.action; const d = el.dataset.d; const slot = el.dataset.slot;
    const week = iso(weekStart);
    switch (a) {
      case 'week-prev': weekStart = addDays(weekStart, -7); render(); break;
      case 'week-next': weekStart = addDays(weekStart, 7); render(); break;
      case 'week-today': weekStart = mondayOf(new Date()); render(); break;
      case 'gen': { const n = generateWeek(weekStart, false); toast(n ? `Proposti ${n} pasti` : 'Settimana già completa'); render(); break; }
      case 'gen-all': if (confirm('Rifaccio tutte le proposte della settimana (tranne quelle bloccate)?')) { generateWeek(weekStart, true); toast('Settimana rifatta'); render(); } break;
      case 'choose': openChooser(d, slot); break;
      case 'reroll': {
        const cur = entry(d, slot)?.id;
        const list = ranked(d, slot).filter(x => x.r.id !== cur && x.s > -150).slice(0, 5);
        if (!list.length) { toast('Nessuna alternativa adatta'); break; }
        const r = list[Math.floor(Math.random() * Math.min(3, list.length))].r;
        setEntry(d, slot, { id: r.id, locked: false }); save(); Sync.days([d]); render(); break;
      }
      case 'lock': { const e = entry(d, slot); if (e) { e.locked = !e.locked; save(); Sync.days([d]); render(); } break; }
      case 'set': setEntry(d, slot, { id: el.dataset.id, locked: true }); save(); Sync.days([d]); closeModal(); render(); break;
      case 'clear': setEntry(d, slot, null); save(); Sync.days([d]); closeModal(); render(); break;
      case 'day-menu': openDayMenu(d); break;
      case 'home': {
        S.plan[d] = S.plan[d] || {}; S.plan[d].home = S.plan[d].home || {};
        S.plan[d].home[el.dataset.k] = el.checked;
        if (!S.plan[d].home.grande && !S.plan[d].home.piccolo) { delete S.plan[d].home; delete S.plan[d].pranzo; }
        save(); Sync.days([d]); render(); break;
      }
      case 'close-modal': closeModal(); break;
      case 'check': {
        const k = el.dataset.key;
        if (k.startsWith('l:')) {
          const id = k.slice(2); const x = S.list[id]; if (!x) break;
          if (el.checked) x.c = true; else delete x.c;
          save(); Sync.list(del => ({ items: { [id]: { c: el.checked ? true : del() } } })); render(); break;
        }
        const st = shopState(weekStart);
        if (el.checked) st.checked[k] = true; else delete st.checked[k];
        save(); Sync.shopCheck(week, k, el.checked); render(); break;
      }
      case 'toggle-show': S.showChecked = el.checked; save(); render(); break;
      case 'toggle-past': S.shopPast = el.checked; save(); render(); break;
      case 'uncheck-all': {
        shopState(weekStart).checked = {}; Sync.shopReplaceChecked(week);
        const ids = Object.keys(S.list).filter(id => S.list[id].c); ids.forEach(id => delete S.list[id].c);
        if (ids.length) Sync.list(del => ({ items: Object.fromEntries(ids.map(id => [id, { c: del() }])) }));
        save(); render(); break;
      }
      case 'del-item': removeFromList(el.dataset.id); render(); break;
      case 'note': {
        const x = S.list[el.dataset.id]; if (!x) break;
        const n = prompt(`Nota per "${x.t}" (quantità, marca…)`, x.note || ''); if (n === null) break;
        const v = n.trim(); if (v) x.note = v; else delete x.note;
        save(); Sync.list(del => ({ items: { [el.dataset.id]: { note: v || del() } } })); render(); break;
      }
      case 'finish-shop': {
        const n = Object.values(S.list).filter(x => x.c).length;
        if (!confirm(`Spesa fatta? Tolgo dalla lista i ${n} prodotti spuntati (restano tra i "Comprati di recente").`)) break;
        finishShopping(); toast('Lista aggiornata 👍'); render(); break;
      }
      case 'catalog': openCatalog(); break;
      case 'cat-toggle': {
        const ex = inList(el.dataset.t);
        if (ex) removeFromList(ex[0]); else addToList(el.dataset.t, el.dataset.r);
        if (catQuery) catQuery = '';
        refreshCatalog(false); render(); break;
      }
      case 'share': shareText(shopText(), 'Lista copiata: incollala su WhatsApp'); break;
      case 'rfilter': recipeFilter.p = el.dataset.p; render(); break;
      case 'target-reset': S.target = {}; save(); Sync.settings(); render(); toast('Valori predefiniti'); break;
      case 'flag': { const id = el.dataset.id, f = el.dataset.f; S.flags[id] === f ? delete S.flags[id] : (S.flags[id] = f); save(); Sync.settings(); render(); break; }
      case 'recipe': openRecipe(el.dataset.id); break;
      case 'new-recipe': openRecipeEditor(null); break;
      case 'edit-recipe': openRecipeEditor(el.dataset.id); break;
      case 'del-recipe': if (confirm(MC_RECIPES.some(x => x.id === el.dataset.id) ? 'Ripristino la ricetta originale?' : 'Elimino questa ricetta?')) {
        S.customRecipes = S.customRecipes.filter(r => r.id !== el.dataset.id); save(); Sync.settings(); closeModal(); render(); } break;
      case 'rep-up': case 'rep-down': {
        const i = +el.dataset.i, j = a === 'rep-up' ? i - 1 : i + 1;
        if (j < 0 || j >= S.reparti.length) break;
        [S.reparti[i], S.reparti[j]] = [S.reparti[j], S.reparti[i]]; save(); Sync.settings(); render(); break;
      }
      case 'grande-paste': openModal(`
        <form data-form="grande" class="space-y-3">
          <div class="flex items-center justify-between"><div class="font-serif text-lg font-bold">Incolla il menù della scuola</div>${closeBtn}</div>
          <p class="text-xs text-muted">Serve solo se l'aggiornamento automatico non funziona. Apri il sito della scuola, seleziona il testo del menù (da "MENU…" all'ultimo venerdì), copia e incolla qui.</p>
          <textarea name="t" rows="10" class="w-full ${inputCls}"></textarea>
          <button class="w-full ${btnPrimary}">Leggi menù</button>
        </form>`); break;
      case 'family-create': if (confirm('Creo il codice famiglia e carico su questo telefono la settimana e la lista attuali?')) {
        S.family = newFamilyCode(); save(); render(); await Sync.start(); render(); } break;
      case 'family-share': shareText(`🍽️ MenuCasa: apri questo link per collegare il telefono al nostro menù della settimana\n${familyLink()}`, 'Link copiato: incollalo su WhatsApp'); break;
      case 'family-leave': if (confirm('Scollego questo telefono? Resta una copia dei dati attuali, ma non si aggiornerà più.')) { Sync.stop(); S.family = null; save(); render(); } break;
      case 'export': {
        const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
        const u = URL.createObjectURL(blob); const l = document.createElement('a');
        l.href = u; l.download = `menucasa-backup-${todayIso()}.json`; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); break;
      }
      case 'reset': if (confirm('Cancello da questo telefono piani, liste, ricette personali e impostazioni? (Se sei collegato alla famiglia, i dati condivisi restano.)')) {
        Sync.stop(); localStorage.removeItem(STORE_KEY); load(); render(); toast('Azzerato'); } break;
    }
  });

  document.addEventListener('submit', (ev) => {
    const f = ev.target.closest('[data-form]'); if (!f) return;
    ev.preventDefault();
    const fd = new FormData(f); const kind = f.dataset.form;
    if (kind === 'cat-add') {
      const t = (fd.get('t') || '').trim(); if (!t) return;
      const hit = knownProducts().find(c => c.t.toLowerCase() === t.toLowerCase());
      addToList(hit?.t || t, hit?.r); catQuery = ''; toast(`Aggiunto: ${hit?.t || t}`);
      refreshCatalog(true); render();
    } else if (kind === 'paste-list') {
      const names = parsePastedList(fd.get('t') || '');
      let n = 0; names.forEach(t => { if (!inList(t)) { addToList(t); n++; } });
      toast(n ? `Aggiunti ${n} prodotti` : 'Niente di nuovo da aggiungere'); refreshCatalog(false); render();
    } else if (kind === 'custom') {
      const t = (fd.get('t') || '').trim(); if (!t) return;
      const d = f.dataset.d, slot = f.dataset.slot;
      const p = fd.get('p') || '', c = fd.get('c') || '';
      if (fd.get('save')) {
        const r = { id: 'u-' + uid(), n: t.charAt(0).toUpperCase() + t.slice(1), p: p || 'verdure', c: c || 'pane', ing: [], custom: true };
        if (slot === 'pranzo') r.s = 'p';
        S.customRecipes = S.customRecipes.concat(r); Sync.settings();
        setEntry(d, slot, { id: r.id, locked: true }); toast('Salvata nel ricettario');
      } else {
        const e = { custom: t, locked: true }; if (p) e.p = p; if (c) e.c = c;
        setEntry(d, slot, e);
      }
      save(); Sync.days([d]); closeModal(); render();
    } else if (kind === 'recipe') {
      const id = f.dataset.id || ('u-' + uid());
      const r = { id, n: fd.get('n').trim(), p: fd.get('p'), c: fd.get('c'), ing: parseIngredients(fd.get('ing') || ''), custom: true };
      if (fd.get('s')) r.s = 'p';
      const orig = recipeById(id); if (orig?.link) r.link = orig.link; if (orig?.fish) r.fish = orig.fish;
      S.customRecipes = S.customRecipes.filter(x => x.id !== id).concat(r); save(); Sync.settings(); closeModal(); render(); toast('Ricetta salvata');
    } else if (kind === 'grande') {
      const weeks = parseGrandeText(fd.get('t') || '');
      const n = Object.keys(weeks).length;
      if (!n) { toast('Non trovo settimane: hai copiato anche le righe "dal … al …"?'); return; }
      Object.assign(S.pastedGrande, weeks); save(); Sync.settings(); closeModal(); render(); toast(`Lette ${n} settimane`);
    } else if (kind === 'join') {
      joinFamily(fd.get('c'), false);
    }
  });

    const el = ev.target.closest('[data-input]'); if (!el) return;
    switch (el.dataset.input) {
      case 'piccolo-week': S.piccolo.anchorMonday = iso(mondayOf(new Date())); S.piccolo.anchorWeek = +el.value; save(); Sync.settings(); toast(`Nido: settimana ${el.value}`); render(); break;
      case 'piccolo-season': S.piccolo.season = el.value; save(); Sync.settings(); render(); break;
      case 'target': {
        const p = el.dataset.p, k = +el.dataset.k; const v = tgt(p).slice();
        v[k] = Math.max(0, Math.min(14, Math.round(+el.value) || 0));
        if (k === 0 && v[1] < v[0]) v[1] = v[0]; if (k === 1 && v[0] > v[1]) v[0] = v[1];
        S.target = { ...(S.target || {}) };
        if (v.join() === TARGET[p].join()) delete S.target[p]; else S.target[p] = v;
        save(); Sync.settings(); render(); break;
      }
      case 'people': S.people = Math.max(1, Math.min(12, +el.value || 4)); save(); Sync.settings(); break;
      case 'import': {
        const file = el.files[0]; if (!file) return;
        try {
          const data = JSON.parse(await file.text()); if (!data.plan) throw 0;
          const fam = S.family; S = Object.assign(DEFAULT_STATE(), data, { family: fam }); save();
          Sync.settings(); Sync.days(Object.keys(S.plan)); render(); toast('Backup importato');
        } catch { toast('File non valido'); }
        break;
      }
    }
  });

  // =====================================================================
  //  Avvio
  // =====================================================================
  (async () => {
    load();
    const m = location.hash.match(/famiglia=([A-Za-z0-9-]+)/);
    history.replaceState(null, '', location.pathname + location.search);
    await loadMenus();
    render();
    if (m) await joinFamily(m[1], true);
    else Sync.start();
  })();
  </script>
</body>
</html>
