name: Aggiorna menù del grande

on:
  schedule:
    - cron: "15 5 * * *"   # ogni giorno alle 05:15 UTC (06:15/07:15 in Italia)
  workflow_dispatch:        # avvio manuale dalla scheda Actions

permissions:
  contents: write

concurrency:
  group: menu-grande
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leggi il menù dal sito della scuola
        run: python scripts/scrape_grande.py

      - name: Salva se è cambiato
        run: |
          if git diff --quiet -- data/grande.json; then
            echo "Nessuna novità."
            exit 0
          fi
          git config user.name "menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grande.json
          git commit -m "Menù del grande aggiornato"
          git push
